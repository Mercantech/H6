# Dokploy: docker compose up -d --build
# Ingen host-ports. Kun Traefik via labels (container-port 3000).
services:
  web:
    build:
      context: ./Rapport
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.h6-template-web.rule=Host(`h6.mercantec.tech`)
      - traefik.http.routers.h6-template-web.entrypoints=web
      - traefik.http.routers.h6-template-web.service=h6-template-web
      - traefik.http.services.h6-template-web.loadbalancer.server.port=3000

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  default:
    name: dokploy-network
    external: true
