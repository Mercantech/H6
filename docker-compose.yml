# Dokploy: docker compose up -d --build
#
# Host(`h6.mercantec.tech`) → web:80 (MkDocs static)
# Elev-apps under src/ kan senere tilføjes som api/web — hold samme mønster.
services:
  web:
    build:
      context: ./Rapport
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.h6-web.rule=Host(`${APP_DOMAIN:-h6.mercantec.tech}`)
      - traefik.http.routers.h6-web.entrypoints=web
      - traefik.http.routers.h6-web.service=h6-web
      - traefik.http.services.h6-web.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  dokploy-network:
    external: true
